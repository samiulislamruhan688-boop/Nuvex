<style>
:root{--bg:#f4f2ec;--card:#fff;--c2:#faf9f5;--ink:#18211e;--mut:#6a736f;--line:#e5e2d8;--a1:#0e6b58;--a2:#1b9a7f;--gold:#c9a24a;--dan:#b3261e;--sh:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1210;--card:#171d1a;--c2:#1c2320;--ink:#eaefec;--mut:#94a09a;--line:#2b3430;--a1:#2fbf9f;--a2:#5fd6ba;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0e1210;--card:#171d1a;--c2:#1c2320;--ink:#eaefec;--mut:#94a09a;--line:#2b3430;--a1:#2fbf9f;--a2:#5fd6ba;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,"Hind Siliguri",system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--a2);outline-offset:-1px}
textarea{min-height:170px;resize:vertical}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 100px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.bar{display:flex;gap:12px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer;flex:none}
.lg{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;display:grid;place-items:center;font:700 20px "Hind Siliguri";box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25),0 3px 10px rgba(14,107,88,.35)}
.wm{display:flex;flex-direction:column;line-height:1.1}.wm b{font:700 18px "Hind Siliguri"}.wm small{font-size:9.5px;letter-spacing:.28em;color:var(--gold);font-weight:600}
.bar input{border-radius:999px;padding:9px 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.tab,.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 15px;white-space:nowrap;font-weight:500;font-size:13.5px}
.tab.on,.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{font-size:12.5px;padding:4px 12px}
.btn{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:13px 22px;box-shadow:0 8px 24px rgba(14,107,88,.45);z-index:6}
.hero{margin-top:10px;border-radius:24px;padding:24px;color:#fff;background:radial-gradient(circle at 90% 0,rgba(201,162,74,.35),transparent 45%),linear-gradient(135deg,#0a3a31,#0e6b58 60%,#17886f);position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero h1{margin:0;font:700 30px/1.15 "Hind Siliguri"}.hero p{margin:4px 0 16px;opacity:.82;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}.stat b{font-size:20px;display:block;line-height:1.2}.stat span{font-size:11.5px;opacity:.8}
.bgr{height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}.bgr i{display:block;height:100%;background:var(--gold);border-radius:9px}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:26px 0 10px;font-weight:600}
h3.ch{font-size:14px;margin:16px 0 8px;color:var(--a1)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sh);transition:.15s}
.sc:hover{transform:translateY(-2px);border-color:var(--a2)}
.bd{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font:700 17px "Hind Siliguri",Inter;margin-bottom:8px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);background:linear-gradient(135deg,hsl(var(--h) 62% 46%),hsl(calc(var(--h) + 28) 62% 34%))}
.bd.sm{width:34px;height:34px;font-size:13px;border-radius:11px;margin:0}
.sc b{font-size:14px;line-height:1.3;font-weight:600}.sc .s2{color:var(--mut);font-size:12.5px;font-family:"Hind Siliguri"}.sc .n{margin-top:6px;font-size:11.5px;color:var(--a1);font-weight:600}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh)}
.row:hover{border-color:var(--a2)}.mid{flex:1;min-width:0}.mid b{word-break:break-word;font-weight:600}
.kd{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:#d4543f}.k-text{background:#3f7bd4}.k-link{background:#8a5cd6}
.meta{color:var(--mut);font-size:12.5px}.tg{color:var(--a1);font-size:12.5px;font-weight:500}
.acts{display:flex}.acts button{background:none;border:0;padding:8px;border-radius:10px;color:var(--mut);display:grid;place-items:center;font-size:18px}.acts button:hover{background:var(--c2);color:var(--ink)}.acts .on{color:var(--gold)}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:36px 12px;border:1.5px dashed var(--line);border-radius:18px}
.sh{display:flex;gap:14px;align-items:center;margin:8px 0 4px}.sh h1{margin:0;font-size:22px;line-height:1.2}.sh span{color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(5,10,8,.62);backdrop-filter:blur(4px);z-index:25;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center;padding:16px}}
.box{background:var(--card);width:100%;max-width:760px;max-height:94vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.box.big{max-width:980px;height:94vh}
@media (min-width:700px){.box{border-radius:22px}}
.box>header{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.box>header b{word-break:break-word}.hb{display:flex;gap:6px;flex:none}.hb .btn{padding:7px 13px}
.cnt{padding:18px;overflow:auto;flex:1}.cnt.pdf{background:var(--c2);padding:12px}
.pgs{width:max-content;min-width:100%}.pg{margin:0 auto 12px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2);border-radius:4px;overflow:hidden}.pg canvas{display:block}
.doc{font-size:16px;line-height:1.75}.doc h3,.doc h4,.doc h5{margin:18px 0 6px;line-height:1.3}.doc p{margin:8px 0}
.doc code{background:var(--c2);padding:1px 6px;border-radius:6px;font-size:.9em}.doc blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--gold);color:var(--mut)}
.doc mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0}
.sec{--c:#6b7cff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:6px 16px 10px;margin:14px 0;background:var(--c2)}.sec.q{--c:#d68a1f}.sec.s{--c:var(--a1)}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c);margin-top:6px}
.f label.l{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}.drop.hl{border-color:var(--a2);background:var(--c2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;z-index:30;font-size:14px;box-shadow:var(--sh)}
.hide{display:none}

:root{--pp:#ebe8df;--sheet:#fffdf8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pp:#0a0d0c;--sheet:#1a201d}}
